@if (store.isLoading()) {
  <p class="text-slate-500">Loading enrollments...</p>
}

<div class="space-y-3">
  @for (enrollment of store.entities(); track enrollment.id) {
    <div class="p-4 bg-white rounded-xl border border-slate-200 flex items-center justify-between shadow-sm">
      <div>
        <h4 class="font-bold text-slate-800">{{ enrollment.studentName }}</h4>
        <p class="text-sm text-slate-500">{{ enrollment.courseName }}</p>
        <span 
          class="inline-block mt-1 text-xs font-semibold px-2.5 py-0.5 rounded-full"
          [class.bg-amber-100]="enrollment.status === 'Pending'"
          [class.text-amber-800]="enrollment.status === 'Pending'"
          [class.bg-emerald-100]="enrollment.status === 'Approved'"
          [class.text-emerald-800]="enrollment.status === 'Approved'"
        >
          {{ enrollment.status }}
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button 
          (click)="onApprove(enrollment.id)"
          [disabled]="enrollment.status === 'Approved'"
          class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 text-white text-xs font-semibold rounded-lg transition"
        >
          Approve
        </button>

        <button 
          (click)="onReject(enrollment.id)"
          [disabled]="enrollment.status === 'Pending'"
          class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 disabled:bg-slate-200 disabled:text-slate-400 text-white text-xs font-semibold rounded-lg transition"
        >
          Reject
        </button>
      </div>
    </div>
  }
</div>

@if (store.error()) {
  <p class="text-sm text-red-600 mt-2">{{ store.error() }}</p>
}
