<div class="h-full bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300 transition-all flex flex-col justify-between group">
  
  <div class="space-y-3">
    <!-- Course Title & Code -->
    <div class="flex items-start justify-between gap-2">
      <h3 class="text-base font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">
        <a [routerLink]="['/courses', course().id]" class="focus:outline-none focus:underline">
          {{ course().title }}
        </a>
      </h3>
      <span class="text-xs font-semibold px-2 py-1 bg-slate-100 text-slate-600 rounded-md shrink-0">
        {{ course().code }}
      </span>
    </div>

    <!-- Enrollment Status Pill -->
    <div>
      <span
        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold"
        [class.bg-emerald-50]="course().enrollmentCount < course().maxCapacity"
        [class.text-emerald-700]="course().enrollmentCount < course().maxCapacity"
        [class.border]="course().enrollmentCount < course().maxCapacity"
        [class.border-emerald-200]="course().enrollmentCount < course().maxCapacity"
        [class.bg-rose-50]="course().enrollmentCount >= course().maxCapacity"
        [class.text-rose-700]="course().enrollmentCount >= course().maxCapacity"
        [class.border-rose-200]="course().enrollmentCount >= course().maxCapacity"
      >
        <span 
          class="w-1.5 h-1.5 rounded-full"
          [class.bg-emerald-500]="course().enrollmentCount < course().maxCapacity"
          [class.bg-rose-500]="course().enrollmentCount >= course().maxCapacity"
        ></span>
        {{ course().enrollmentCount >= course().maxCapacity ? "Full" : "Accepting enrollments" }}
      </span>
    </div>

    <!-- Capacity Bar & Count -->
    <div class="space-y-1.5 pt-1">
      <div class="flex justify-between text-xs text-slate-500 font-medium">
        <span>Seats Occupied</span>
        <span>{{ course().enrollmentCount }} / {{ course().maxCapacity }}</span>
      </div>
      <!-- Progress Bar -->
      <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
        <div 
          class="h-full bg-indigo-500 rounded-full transition-all duration-500"
          [style.width.%]="(course().enrollmentCount / course().maxCapacity) * 100"
          [class.bg-rose-500]="course().enrollmentCount >= course().maxCapacity"
        ></div>
      </div>
    </div>
  </div>

  <!-- Action Button -->
  <div class="pt-5 mt-4 border-t border-slate-100">
    <button
      (click)="enrollClicked.emit(course())"
      [disabled]="course().enrollmentCount >= course().maxCapacity"
      class="w-full py-2.5 px-4 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white active:bg-indigo-700"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      {{ course().enrollmentCount >= course().maxCapacity ? "Course Full" : "Enroll" }}
    </button>
  </div>

</div>
